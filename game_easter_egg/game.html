<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sol III Intercepted - Core Retrieval</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>

<div id="portrait-warning">
    <p>Please rotate your device to landscape mode to play.</p>
    <div style="font-size: 40px; margin-top: 20px;">↻</div>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div>
            <div class="stat">Pilot: KAHZ HABTOM</div>
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
        <div style="text-align: right;">
            <div class="stat">ENERGY CORES: <span id="score-display">0</span> / 5</div>
            <div class="stat" id="controls-hint" style="margin-top: 5px; font-size: 12px; color: #aaa;">WASD: Move | Mouse: Aim/Shoot</div>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="dpad">
            <button id="btn-up" class="ctrl-btn">▲</button>
            <div class="dpad-row">
                <button id="btn-left" class="ctrl-btn">◄</button>
                <button id="btn-down" class="ctrl-btn">▼</button>
                <button id="btn-right" class="ctrl-btn">►</button>
            </div>
        </div>
    </div>

    <div id="game-over">
        <h1 id="end-title">CRITICAL FAILURE</h1>
        <p id="end-message">"We estimate the global population at a mere 8,000. And now, one less."</p>
        <button id="restart-btn">Restart Simulation</button>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
